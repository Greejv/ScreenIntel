name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest ruff
      - run: ruff check .
      - run: pytest -q tests

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: ScreenIntel.exe
          - os: macos-latest
            asset: ScreenIntel-mac.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller --onefile --noconsole --name ScreenIntel main.py

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --windowed --name ScreenIntel --osx-bundle-identifier io.github.greejv.screenintel main.py
          cd dist && ditto -c -k --keepParent ScreenIntel.app ScreenIntel-mac.zip

      # Start the built app with a dummy key: it must still be running after 8 s, then quit by itself
      # (SCREENINTEL_QUIT_AFTER_MS), exit with code 0 and leave no temporary files behind.
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GEMINI_API_KEY: ci-dummy-key
          SCREENINTEL_QUIT_AFTER_MS: "12000"
        run: |
          $before = @(Get-ChildItem $env:TEMP -Directory -Filter "_MEI*" -ErrorAction SilentlyContinue).Name
          $p = Start-Process dist\ScreenIntel.exe -PassThru
          $null = $p.Handle  # keep the handle so ExitCode is readable later
          Start-Sleep 8
          if ($p.HasExited) { throw "App exited early with code $($p.ExitCode)" }
          if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force; throw "App did not quit" }
          if ($p.ExitCode -ne 0) { throw "App exited with code $($p.ExitCode)" }
          Start-Sleep 2
          if (Get-Process ScreenIntel -ErrorAction SilentlyContinue) { throw "ScreenIntel process left running" }
          $left = @(Get-ChildItem $env:TEMP -Directory -Filter "_MEI*" -ErrorAction SilentlyContinue).Name |
            Where-Object { $_ -notin $before }
          if ($left) { throw "Temporary folder left behind: $left" }
          Write-Host "Clean start and shutdown."

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        env:
          GEMINI_API_KEY: ci-dummy-key
          SCREENINTEL_QUIT_AFTER_MS: "12000"
        run: |
          dist/ScreenIntel.app/Contents/MacOS/ScreenIntel &
          pid=$!
          sleep 8
          kill -0 $pid || { echo "App exited early"; exit 1; }
          for i in $(seq 60); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          if kill -0 $pid 2>/dev/null; then kill -9 $pid; echo "App did not quit"; exit 1; fi
          wait $pid || { echo "App exited with an error"; exit 1; }
          if pgrep -f ScreenIntel.app; then echo "ScreenIntel process left running"; exit 1; fi
          echo "Clean start and shutdown."

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  # Publishes a release when VERSION names a version that has no release yet
  # (or when a v* tag is pushed). Bump VERSION and push to main to release.
  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Pick version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="${GITHUB_REF#refs/tags/}"; else tag="v$(cat VERSION)"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists, skipping."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.new == 'true'
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.new == 'true'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            ScreenIntel.exe
            ScreenIntel-mac.zip
          generate_release_notes: true
