name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest ruff
      - run: ruff check .
      - run: pytest -q tests

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: ScreenIntel.exe
          - os: macos-latest
            asset: ScreenIntel-mac.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller --onefile --noconsole --name ScreenIntel main.py

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --windowed --name ScreenIntel --osx-bundle-identifier io.github.greejv.screenintel main.py
          cd dist && ditto -c -k --keepParent ScreenIntel.app ScreenIntel-mac.zip

      # Start the built app with a dummy key and check it is still running after 15 s.
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GEMINI_API_KEY: ci-dummy-key
        run: |
          $p = Start-Process dist\ScreenIntel.exe -PassThru
          Start-Sleep 15
          if ($p.HasExited) { throw "App exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        env:
          GEMINI_API_KEY: ci-dummy-key
        run: |
          dist/ScreenIntel.app/Contents/MacOS/ScreenIntel &
          pid=$!
          sleep 15
          kill -0 $pid || { echo "App exited early"; exit 1; }
          kill $pid

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ScreenIntel.exe
            ScreenIntel-mac.zip
          generate_release_notes: true
